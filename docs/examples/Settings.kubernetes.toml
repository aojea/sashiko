# Local Kubernetes review with the Gemini API (set GEMINI_API_KEY or
# LLM_API_KEY). Setup: docs/kubernetes-review.md. For other providers, see
# docs/llm-providers.md.

[project]
kind = "kubernetes"

[ai]
provider = "gemini"
model = "gemini-4-argon"
max_input_tokens = 900000
max_interactions = 100
temperature = 1.0

[review]
# Analysis stages of one commit run in parallel; lower this on rate limits.
concurrency = 8
